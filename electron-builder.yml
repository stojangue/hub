appId: com.stojangue.hub
productName: Hub
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  # Code signing and notarization are out of scope for now.
  identity: null
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
